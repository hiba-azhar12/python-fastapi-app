name: TMP Q3
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Write two outputs with a single arrow
        id: two
        run: |
          echo "a=1" > $GITHUB_OUTPUT
          echo "b=2" > $GITHUB_OUTPUT
      - name: Print the two outputs
        run: echo "a=[${{ steps.two.outputs.a }}] b=[${{ steps.two.outputs.b }}]"
